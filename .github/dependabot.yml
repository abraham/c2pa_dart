version: 2
updates:
  # Root Dart pub workspace and its member packages
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/packages/c2pa"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/packages/c2pa_io"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/packages/c2pa_codec"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/packages/c2pa_crypto"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/packages/c2pa_formats"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/packages/c2pa_testkit"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/packages/c2patool_dart"
    schedule:
      interval: "weekly"
    groups:
      pub-dependencies:
        patterns:
          - "*"

  # npm tooling used for commit message linting
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions used in CI/publish workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
