name: Publish

# Triggered either by pushing a git tag or by a manual dispatch; pub.dev is
# configured to allow automated publishing from both. Both triggers publish
# identically, in dependency order.
on:
  push:
    tags:
      # Matches the `v${version}` tags scripts/publish.sh creates, including
      # prerelease versions such as v0.1.0-dev.2. Must equal the tag-pattern
      # (v{{version}}) configured in each package's pub.dev Admin page.
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with .github/workflows/ci.yml.
  DART_SDK_VERSION: 3.13.4
  NODE_VERSION: 22.23.2

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Requires a GitHub environment named `pub.dev` to exist in this repo
    # (created automatically on first use, or in advance under Settings >
    # Environments). Each package's pub.dev Admin > Automated publishing
    # section must in turn have "Require GitHub Actions environment" set to
    # `pub.dev`, so the OIDC token's environment claim is checked on upload.
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # consumed by `dart pub publish` for OIDC authentication
    steps:
      - uses: actions/checkout@v7
      - name: Set PUB_CACHE path
        run: echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install commitlint
        run: npm ci
      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-${{ hashFiles('pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-
      - name: Publish workspace in dependency order
        # scripts/publish.sh re-validates the version, changelogs, and
        # working tree; publishes packages/{c2pa_io,c2pa_codec,c2pa_crypto,
        # c2pa_formats,c2pa,c2pa_testkit,c2patool_dart} in that dependency
        # order; and waits for each upload to become resolvable on pub.dev
        # before publishing its dependents. Already-published versions are
        # skipped, so re-running this job resumes a partial release.
        run: scripts/publish.sh --publish
