name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DART_SDK_VERSION: 3.13.4
  FLUTTER_VERSION: 3.47.5

jobs:
  dart:
    name: Dart ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PUB_CACHE: ${{ runner.temp }}/pub-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-${{ hashFiles('pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-
      - name: Resolve workspace
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages tool
      - name: Analyze workspace
        run: dart analyze
      - name: Check compatibility ledger
        run: dart run tool/check_compatibility.dart
      - name: Test every package
        run: dart run tool/test_all.dart
  browser:
    name: Browser compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUB_CACHE: ${{ runner.temp }}/pub-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-${{ hashFiles('pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-
      - name: Resolve workspace
        run: dart pub get
      - name: Compile web-safe package barrels
        shell: bash
        run: |
          (cd packages/c2pa_io && dart compile js tool/web_compile_smoke.dart -o .dart_tool/ci/web_compile_smoke.js)
          (cd packages/c2pa_codec && dart compile js tool/web_compile_smoke.dart -o .dart_tool/ci/web_compile_smoke.js)
          (cd packages/c2pa_crypto && dart compile js tool/web_compile_smoke.dart -o .dart_tool/ci/web_compile_smoke.js)
      - name: Test browser cryptography
        working-directory: packages/c2pa_crypto
        run: >-
          dart test --platform chrome
          test/asset_hash_test.dart
          test/crl_test.dart
          test/ocsp_test.dart
          test/path_validation_test.dart
          test/timestamp_test.dart
          test/trust_list_test.dart
          test/webcrypto_backend_test.dart
          test/x509_certificate_test.dart
  flutter:
    name: Flutter stable compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ runner.temp }}/pub-cache
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace with Flutter
        run: flutter pub get
      - name: Analyze pure-Dart packages with Flutter tooling
        run: flutter analyze
      - name: Test native and browser-compatible packages
        shell: bash
        run: |
          for package in c2pa_io c2pa_codec c2pa_crypto c2pa_formats c2pa; do
            (cd "packages/$package" && dart test)
          done
