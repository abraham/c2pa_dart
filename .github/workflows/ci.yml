name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DART_SDK_VERSION: 3.13.4
  FLUTTER_VERSION: 3.47.5
  # commitlint 21 requires >= 22.12.0; pinned for the same reason the Dart and
  # Flutter versions are.
  NODE_VERSION: 22.23.2

jobs:
  commits:
    # Commit messages are the one input CI cannot re-derive later, so they are
    # checked before anything expensive runs.
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Not a default variable; scripts/lint-commits.sh uses it on push events
      # to bound the range to the commits actually being pushed.
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with the target branch has to be reachable, which a
          # shallow checkout cannot guarantee.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install commitlint
        run: npm ci
      - name: Check commit messages
        run: scripts/lint-commits.sh
  dart:
    name: Dart ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # jobs.<job_id>.env cannot see the runner context, so PUB_CACHE is
      # derived here instead, where runner.temp is available.
      - name: Set PUB_CACHE path
        shell: bash
        run: echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}
      - uses: actions/setup-node@v4
        # The workspace tooling suite (commitlint-backed changelog checks) is
        # Node-version sensitive and only runs on Linux, so only Linux needs
        # Node set up at all.
        if: runner.os == 'Linux'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install commitlint
        if: runner.os == 'Linux'
        run: npm ci
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-${{ hashFiles('pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-
      - name: Resolve workspace
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages tool test
      - name: Analyze workspace
        run: dart analyze
      - name: Lint shell scripts
        # Linux only: the scripts are identical everywhere and shellcheck is
        # preinstalled on the Ubuntu runner.
        if: runner.os == 'Linux'
        run: shellcheck -x scripts/*.sh
      - name: Check compatibility ledger
        run: dart run tool/check_compatibility.dart
      - name: Test workspace tooling
        # Only needs to run once; it exercises repo tooling (e.g. the
        # commitlint-backed changelog checks), not any published package.
        if: runner.os == 'Linux'
        run: dart run tool/test_all.dart --workspace-only
      - name: Test every package
        run: dart run tool/test_all.dart --packages-only
  packages:
    # pub.dev scores the archive it receives, not the tree the analyzer sees.
    # An example pana does not recognise by name, or a LICENSE holding a
    # dual-license pointer rather than license text, both pass `dart analyze`
    # and both silently cost points on the published page.
    name: Package health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # jobs.<job_id>.env cannot see the runner context, so PUB_CACHE is
      # derived here instead, where runner.temp is available.
      - name: Set PUB_CACHE path
        run: echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-${{ hashFiles('pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-
      - name: Resolve workspace
        run: dart pub get
      - name: Validate publishable packages
        # Runs `dart pub publish --dry-run` and pana over every package. The
        # script activates pana itself rather than pinning a scoring tool into
        # a pubspec that ships to consumers.
        run: scripts/package-health.sh
  conformance:
    # Every other job reads assets this SDK also wrote, so they can only prove
    # self-consistency. This one compares against the c2pa-rs reference build
    # over a corpus signed by other producers, which is the only check that can
    # catch us agreeing with ourselves and disagreeing with the spec.
    name: c2pa-rs conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read conformance pins
        id: pins
        run: scripts/conformance-pins.sh
      # jobs.<job_id>.env cannot see the runner context, so PUB_CACHE is
      # derived here instead, where runner.temp is available.
      - name: Set PUB_CACHE path
        run: echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-${{ hashFiles('pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-
      - name: Resolve workspace
        run: dart pub get
      - name: Cache reference c2patool
        id: oracle-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oracle
          key: c2patool-${{ steps.pins.outputs.version }}-${{ steps.pins.outputs.sha256 }}
      - name: Fetch and verify the reference c2patool
        # No cache-hit condition: the script verifies the binary against the
        # pin every time, including when it was restored from the cache.
        run: scripts/fetch-oracle.sh --dir "${RUNNER_TEMP}/oracle"
      - name: Check out the pinned public test corpus
        run: scripts/fetch-corpus.sh --dir "${RUNNER_TEMP}/corpus"
      - name: Compare against c2pa-rs
        run: |
          scripts/conformance.sh \
            --oracle "${RUNNER_TEMP}/oracle/${{ steps.pins.outputs.binary }}" \
            --corpus "${RUNNER_TEMP}/corpus" \
            --json "${RUNNER_TEMP}/conformance.json"
      - name: Upload conformance report
        # Kept on success too: the report is the evidence behind the pass, and
        # a diff between two runs is how a regression gets localised.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: ${{ runner.temp }}/conformance.json
          if-no-files-found: warn
  browser:
    name: Browser compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # jobs.<job_id>.env cannot see the runner context, so PUB_CACHE is
      # derived here instead, where runner.temp is available.
      - name: Set PUB_CACHE path
        run: echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-${{ hashFiles('pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-dart-${{ env.DART_SDK_VERSION }}-
      - name: Resolve workspace
        run: dart pub get
      - name: Compile web-safe package barrels
        run: scripts/web-compile.sh
      - name: Test browser cryptography
        run: scripts/browser-test.sh
  flutter:
    name: Flutter stable compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # jobs.<job_id>.env cannot see the runner context, so PUB_CACHE is
      # derived here instead, where runner.temp is available.
      - name: Set PUB_CACHE path
        run: echo "PUB_CACHE=${RUNNER_TEMP}/pub-cache" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace with Flutter
        run: flutter pub get
      - name: Analyze pure-Dart packages with Flutter tooling
        run: flutter analyze
      - name: Test native and browser-compatible packages
        run: scripts/test-packages.sh
